<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investor Relation Grid</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      --navy: #0e2a4d;
      --navy-soft: #24466f;
      --green: #3fa66a;
      --green-dark: #2f8a56;
      --bg: #f8f9fb;
      --bg-card: #ffffff;
      --border: #e6e8ec;
      --border-soft: #eef0f3;
      --text-primary: #14213a;
      --text-secondary: #5b6472;
      --shadow-card: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.03);
      --shadow-card-hover: 0 24px 48px -12px rgba(14, 42, 77, 0.18), 0 8px 16px -8px rgba(14, 42, 77, 0.08);
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --dur: 0.35s;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .grid-page {
      padding: 48px 24px 80px;
    }

    .grid-page .gallery-container {
      max-width: 1450px;
      margin: auto;
      padding: 0 18px;
    }

    .gallery-section {
      background: transparent;
      padding: 0;
    }

    .gallery-header {
      max-width: 640px;
      margin-bottom: 64px;
    }

    .eyebrow {
      margin: 0 0 18px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--green-dark);
      text-transform: uppercase;
    }

    .gallery-title {
      margin: 0 0 20px;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(32px, 4vw, 44px);
      line-height: 1.15;
      color: var(--navy);
      letter-spacing: -0.01em;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .project-card {
      display: block;
      width: 100%;
      padding: 0;
      border: 1px solid #e8e8e8;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      text-align: left;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
      transition: 0.35s;
    }

    .project-card:hover,
    .project-card:focus-visible {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      border-color: #e8e8e8;
    }

    .project-card:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 3px;
    }

    .project-card-media {
      position: relative;
      height: 265px;
      overflow: hidden;
      border-radius: 18px 18px 0 0;
      background: #f5f5f5;
    }

    .project-card-media::before,
    .project-card-media::after {
      display: none;
    }

    .project-card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .project-card:hover .project-card-image {
      transform: scale(1.05);
    }

    .project-card-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .project-card-country {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.3;
      color: #0f2745;
      letter-spacing: -0.01em;
    }

    .project-card-description {
      margin: 0;
      font-size: 16px;
      line-height: 1.7;
      color: #6c7381;
    }

    .project-card-view {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #9b8f7d;
      text-transform: uppercase;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-decoration: none;
    }

    .project-card-view::after {
      content: "↗";
      width: 38px;
      height: 38px;
      border: 1px solid #ddd;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
    }

    .project-card:hover .project-card-view::after {
      background: #163b63;
      color: white;
      border-color: #163b63;
    }

    @media (max-width: 1024px) {
      .project-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
      }
    }

    @media (max-width: 640px) {
      .grid-page {
        padding: 24px 20px 56px;
      }

      .gallery-header {
        margin-bottom: 40px;
      }

      .project-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="grid-page">
    <section class="gallery-section" aria-labelledby="grid-heading">
      <div class="gallery-container">
        <header class="gallery-header">
          <p class="eyebrow">INVESTOR RELATIONS</p>
          <h2 id="grid-heading" class="gallery-title">Project Grid Preview</h2>
        </header>

        <div class="project-grid" id="projectGrid" role="list"></div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const projects = [
        {
          title: "Corporate Governance",
          description: "Board structure, committees and governance framework.",
          viewLabel: "View",
          href: "corporate Governance/page1.html",
          image: "1.webp"
        },
        {
          title: "Updates & Announcements",
          description: "Latest filings, press releases and stock-exchange intimations.",
          viewLabel: "View",
          image: "2.webp"
        },
        {
          title: "Shareholding Pattern",
          description: "Quarterly disclosure of equity holding distribution.",
          viewLabel: "View",
          image: "3.webp"
        },
        {
          title: "Investor Presentation",
          description: "Decks, business updates and analyst material.",
          viewLabel: "View",
          image: "4.webp"
        },
        {
          title: "Dividend",
          description: "Declared and historical dividend information.",
          viewLabel: "View",
          href: "dividend/page1.html",
          image: "5.webp"
        },
        {
          title: "Financial Reports",
          description: "Quarterly, half-yearly and annual financial results.",
          viewLabel: "View",
          href: "financial-reports/page1.html",
          image: "6.webp"
        },
        {
          title: "Annual Report & Annual Return",
          description: "Audited annual reports and annual returns under the Companies Act.",
          viewLabel: "View",
          href: "annual-report/page1.html",
          image: "7.webp"
        },
        {
          title: "Policies",
          description: "Statutory policies and adopted by the Board.",
          viewLabel: "View",
          image: "8.webp"
        },
        {
          title: "Investor Grievances",
          description: "Investor complaints ,escalation and SCORES information.",
          viewLabel: "View",
          href: "investor-grievances/page1.html",
          image: "9.webp"
        },
        {
          title: "Board of Directors & Committees",
          description: "Directors of the Company, their roles and profiles.",
          viewLabel: "View",
          href: "board-directors/page1.html",
          image: "10.webp"
        },
        {
          title: "Contact Details",
          description: "Compliance officer,registrar and investor relation contacts.",
          viewLabel: "View",
          href: "contact-details/page1.html",
          image: "11.webp"
        },
        {
          title: "Disclosures under Regulation 46 of SEBI (LODR) Regulations, 2015",
          description: "Statutory disclosures required under Regulation 46 of SEBI(LODR).",
          viewLabel: "View",
          href: "regulation-46/index.html",
          image: "12.webp"
        }
      ];

      const grid = document.getElementById("projectGrid");

      if (!grid) {
        return;
      }

      function renderGrid() {
        const fragment = document.createDocumentFragment();

        projects.forEach(function (item) {
          const card = document.createElement("article");
          card.className = "project-card";
          card.setAttribute("role", "listitem");

          const media = document.createElement("div");
          media.className = "project-card-media";

          if (item.image) {
            const img = document.createElement("img");
            img.src = item.image;
            img.alt = item.title;
            img.className = "project-card-image";
            media.appendChild(img);
          }

          const body = document.createElement("div");
          body.className = "project-card-body";

          const title = document.createElement("h3");
          title.className = "project-card-country";
          title.textContent = item.title;

          const description = document.createElement("p");
          description.className = "project-card-description";
          description.textContent = item.description;

          const viewLink = document.createElement("a");
          viewLink.className = "project-card-view";
          viewLink.href = item.href || "#";
          viewLink.textContent = item.viewLabel;

          body.appendChild(title);
          body.appendChild(description);
          body.appendChild(viewLink);
          card.appendChild(media);
          card.appendChild(body);
          if (item.href) {
            card.style.cursor = "pointer";
            card.addEventListener("click", function () {
              window.location.href = item.href;
            });
          }
          fragment.appendChild(card);
        });

        grid.appendChild(fragment);
      }

      renderGrid();
    })();
  </script>
</body>

</html>
